plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.bvrgames.tvaccel.phone"
    compileSdk 35
    defaultConfig {
        applicationId "com.bvrgames.tvaccel.phone"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.12.0"
        ndk { abiFilters "arm64-v8a" }  // Python 3.12 in Chaquopy is 64-bit only
    }
    // One permanent key, so new versions install over old ones. CI gets it from the repo's
    // secrets (PHONE_KEYSTORE, PHONE_KEYSTORE_PASS); without them the release is debug-signed.
    signingConfigs {
        release {
            storeFile System.getenv("PHONE_KEYSTORE") ? file(System.getenv("PHONE_KEYSTORE")) : null
            storePassword System.getenv("PHONE_KEYSTORE_PASS")
            keyAlias "tvaccelphone"
            keyPassword System.getenv("PHONE_KEYSTORE_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("PHONE_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
            pickFirsts += ["org/bouncycastle/**"]  // the same data files ship in two Bouncy Castle jars
        }
    }
}

// The same Python program as on Windows and Mac (copied into src/main/python by the build).
chaquopy {
    defaultConfig {
        version "3.12"
        extractPackages "tvaccel"  // the menu APK and the web page must be real files
    }
}

dependencies {
    implementation "com.github.MuntashirAkon:libadb-android:3.1.1"  // Apache-2.0 (dual GPL-3.0)
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"  // certificate for the adb key; same flavour libadb uses
}
